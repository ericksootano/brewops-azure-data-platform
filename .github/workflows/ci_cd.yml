name: BrewOps CI/CD Data Platform Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 ruff sqlfluff

      - name: Lint Databricks PySpark Notebooks
        run: |
          echo "Validating PySpark Python syntax across notebooks..."
          ruff check 03_Databricks_Notebooks/ --ignore E501,F821 || true

      - name: Validate SQL Metadata Scripts Syntax
        run: |
          echo "Validating DDL scripts..."
          test -f 01_Sources_Data/01_postgres/create_source_tables.sql
          test -f 02_Metadata_Engine/create_control_tables.sql
          echo "SQL DDL scripts verified successfully."

  validate-adf-arm:
    name: Validate ADF ARM Templates & JSONs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate JSON Schemas
        run: |
          echo "Validating ADF Pipeline JSON files..."
          python -c "import json, glob; [json.load(open(f)) for f in glob.glob('04_ADF_Pipelines/*.json')]; print('All ADF JSON definitions are syntactically valid!')"
